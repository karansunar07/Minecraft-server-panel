services:
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: ws://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://panel:panel@database:5432/panel
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      PROVIDER: mock
      SESSION_SECRET: ${SESSION_SECRET:-change-me-with-a-long-random-value}
      PTERODACTYL_URL: ${PTERODACTYL_URL:-}
      PTERODACTYL_API_KEY: ${PTERODACTYL_API_KEY:-}
      WINGS_URL: ${WINGS_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: panel
    volumes:
      - panel-data:/var/lib/postgresql/data

volumes:
  panel-data:
